<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="کافه لوچه (Café Luce) — با هر جرعه روشنایی رو بچش. منوی نوشیدنی و غذای کافه لوچه، کنگان."
    />
    <meta name="theme-color" content="#fff5d4" />
    <title>کافه لوچه | Café Luce</title>
    <link rel="icon" type="image/jpeg" href="imges/luce-logo.jpg" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header" id="site-header">
      <div class="flag" aria-hidden="true">
        <span class="flag__green"></span>
        <span class="flag__white"></span>
        <span class="flag__red"></span>
      </div>
      <img
        class="header__logo"
        src="imges/luce-logo.jpg"
        alt="لوگوی کافه لوچه"
        width="168"
        height="168"
      />
    </header>

    <section class="hero">
      <h1 class="hero__title">Cafe Luće</h1>
      <p class="hero__tagline">«با هر جرعه روشنایی رو بچش»</p>
    </section>

    <main class="main">
      <div class="container">
        <section class="menu-section" aria-labelledby="menu-title">
          <h2 class="menu-section__title" id="menu-title">منو</h2>
          <nav class="categories" id="categories" aria-label="دسته‌بندی منو"></nav>
          <ul class="menu" id="menu-list" aria-live="polite"></ul>
          <noscript>
            <p class="noscript">برای مشاهده‌ٔ منو، جاوااسکریپت مرورگر را فعال کنید.</p>
          </noscript>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer__contact">
          <a
            class="contact-card"
            href="https://instagram.com/luce.italiano"
            target="_blank"
            rel="noopener"
          >
            <span class="contact-card__icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="3" width="18" height="18" rx="5" />
                <circle cx="12" cy="12" r="4.2" />
                <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none" />
              </svg>
            </span>
            <span>
              <span class="contact-card__label">اینستاگرام</span>
              <span class="contact-card__value contact-card__value--accent"
                >@luce.italiano</span
              >
            </span>
          </a>

          <div class="contact-card">
            <span class="contact-card__icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M5 4h4l1.5 4.5-2.2 1.6a12 12 0 0 0 5.6 5.6l1.6-2.2L20 15v4a2 2 0 0 1-2.2 2A16.8 16.8 0 0 1 3 6.2 2 2 0 0 1 5 4z"
                />
              </svg>
            </span>
            <ul class="phones">
              <li>
                <a class="phone" href="tel:+989175525579">0917 552 5579</a>
              </li>
              <li>
                <a class="phone" href="tel:+989964518196">0996 451 8196</a>
              </li>
            </ul>
          </div>
        </div>

        <div class="footer__map">
          <iframe
            class="map"
            src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3528.605206573292!2d52.074615984935534!3d27.821920582744653!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMjfCsDQ5JzE4LjkiTiA1MsKwMDQnMjAuNyJF!5e0!3m2!1sfa!2s!4v1765552947201!5m2!1sfa!2s"
            title="نقشه موقعیت کافه لوچه"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
          <p class="footer__address">
            استان بوشهر، کنگان، خیابان غدیر غربی، بین فرعی ۹ و خیابان توحید
          </p>
        </div>
      </div>
    </footer>

    <script src="js/app.js" defer></script>
  </body>
</html>
