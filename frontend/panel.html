<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>پنل مدیریت | کافه لوچه</title>
    <link rel="icon" type="image/jpeg" href="images/luce-logo.jpg" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/panel.css" />
  </head>
  <body class="panel-body is-locked">
    <!-- ورود به پنل — بدون رمز، پنل باز نمی‌شود -->
    <section class="panel-login" id="panel-login">
      <img
        class="panel-login__bg"
        src="images/luce-bg.jpeg"
        alt=""
        aria-hidden="true"
      />
      <div class="card panel-login__card">
        <a
          class="panel-login__logo-link"
          href="index.html"
          aria-label="مشاهدهٔ سایت کافه لوچه"
        >
          <img
            class="panel-login__logo"
            src="images/luce-logo.jpg"
            alt="لوگوی کافه لوچه"
            width="168"
            height="168"
          />
        </a>
        <h2 class="panel-login__title">ورود به پنل مدیریت</h2>
        <form id="login-form" class="panel-login__form" novalidate>
          <input
            id="login-username"
            class="input input--ltr"
            type="text"
            placeholder="Username"
            required
            autocomplete="username"
            dir="ltr"
          />
          <div class="password-field">
            <input
              id="login-password"
              class="input"
              type="password"
              placeholder="Password"
              required
              autocomplete="current-password"
              dir="ltr"
            />
            <button
              type="button"
              class="password-toggle"
              aria-label="نمایش رمز"
              aria-pressed="false"
              title="نمایش/مخفی‌کردن رمز"
            >
              <svg
                class="icon-eye"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg
                class="icon-eye-off"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
          <button class="btn btn--primary" type="submit">ورود</button>
        </form>
      </div>
    </section>

    <header class="panel-header">
      <div class="panel-header__inner container">
        <h1 class="panel-header__title">پنل مدیریت لوچه</h1>
        <a class="btn btn--ghost" href="index.html">مشاهدهٔ سایت</a>
      </div>
    </header>

    <nav class="tabs container" aria-label="بخش‌های پنل">
      <button type="button" class="tab is-active" data-tab="categories" aria-selected="true">
        دسته‌بندی‌ها
      </button>
      <button type="button" class="tab" data-tab="items" aria-selected="false">
        آیتم‌های منو
      </button>
    </nav>

    <main class="container panel-main">
      <!-- دسته‌بندی‌ها -->
      <section class="panel-section" id="tab-categories">
        <div class="card">
          <button id="open-category-modal" class="btn btn--primary btn--block" type="button">
            افزودن دستهٔ جدید
          </button>
        </div>

        <ul class="list" id="category-list"></ul>
      </section>

      <!-- آیتم‌های منو -->
      <section class="panel-section" id="tab-items" hidden>
        <div class="card card--category-picker">
          <h2 class="card__title">انتخاب دسته</h2>
          <div class="category-picker" id="item-category-picker" role="tablist" aria-label="دسته‌ها"></div>
        </div>

        <div class="card">
          <button id="open-item-modal" class="btn btn--primary btn--block" type="button">
            افزودن آیتم جدید
          </button>
        </div>

        <ul class="list" id="item-list"></ul>
      </section>
    </main>

    <footer class="panel-footer container">
      <div class="panel-footer__box">
        <button id="add-manager-btn" class="btn btn--primary" type="button">افزودن مدیر</button>
        <button id="change-password-btn" class="btn btn--ghost" type="button">تغییر دادن رمز</button>
      </div>
    </footer>

    <!-- مودال افزودن دسته -->
    <div class="modal" id="category-modal" hidden>
      <div class="modal__backdrop" data-close-modal></div>
      <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="category-modal-title">
        <h2 class="modal__title" id="category-modal-title">افزودن دستهٔ جدید</h2>
        <form id="category-form" class="modal__form" novalidate>
          <input
            id="category-name"
            class="input"
            type="text"
            placeholder="نام دسته"
            aria-label="نام دسته"
            maxlength="40"
            required
            autocomplete="off"
          />
          <textarea
            id="category-svg"
            class="input"
            rows="5"
            placeholder="کد SVG آیکون"
            aria-label="کد SVG آیکون"
            dir="ltr"
            spellcheck="false"
          ></textarea>
          <div class="modal__actions">
            <button id="category-submit-btn" class="btn btn--primary" type="submit">افزودن</button>
            <button class="btn btn--danger-solid" type="button" data-close-modal>انصراف</button>
          </div>
        </form>
      </div>
    </div>

    <!-- مودال افزودن مدیر -->
    <div class="modal" id="manager-modal" hidden>
      <div class="modal__backdrop" data-close-manager></div>
      <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="manager-modal-title">
        <h2 class="modal__title" id="manager-modal-title">افزودن مدیر</h2>
        <form id="manager-form" class="modal__form" novalidate>
          <input
            id="manager-username"
            class="input input--ltr"
            type="text"
            placeholder="Username"
            aria-label="Username"
            required
            autocomplete="off"
            dir="ltr"
          />
          <input
            id="manager-password"
            class="input"
            type="password"
            placeholder="Password"
            aria-label="Password"
            required
            autocomplete="new-password"
            dir="ltr"
          />
          <input
            id="manager-password-confirm"
            class="input"
            type="password"
            placeholder="Confirm Password"
            aria-label="Confirm Password"
            required
            autocomplete="new-password"
            dir="ltr"
          />
          <div class="modal__actions">
            <button class="btn btn--primary" type="submit">افزودن</button>
            <button class="btn btn--danger-solid" type="button" data-close-manager>انصراف</button>
          </div>
        </form>
      </div>
    </div>

    <!-- مودال افزودن آیتم -->
    <div class="modal" id="item-modal" hidden>
      <div class="modal__backdrop" data-close-item></div>
      <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="item-modal-title">
        <h2 class="modal__title" id="item-modal-title">افزودن آیتم جدید</h2>
        <form id="item-form" class="modal__form" novalidate>
          <input
            id="item-name"
            class="input"
            type="text"
            placeholder="نام آیتم"
            aria-label="نام آیتم"
            maxlength="60"
            required
            autocomplete="off"
          />
          <div class="modal__actions">
            <button id="item-submit-btn" class="btn btn--primary" type="submit">افزودن</button>
            <button class="btn btn--danger-solid" type="button" data-close-item>انصراف</button>
          </div>
        </form>
      </div>
    </div>

    <!-- مودال تغییر رمز -->
    <div class="modal" id="change-password-modal" hidden>
      <div class="modal__backdrop" data-close-change-password></div>
      <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="change-password-modal-title">
        <h2 class="modal__title" id="change-password-modal-title">تغییر دادن رمز</h2>
        <form id="change-password-form" class="modal__form" novalidate>
          <input
            id="cp-current"
            class="input"
            type="password"
            placeholder="Current Password"
            aria-label="Current Password"
            required
            autocomplete="current-password"
            dir="ltr"
          />
          <input
            id="cp-new"
            class="input"
            type="password"
            placeholder="New Password"
            aria-label="New Password"
            required
            autocomplete="new-password"
            dir="ltr"
          />
          <input
            id="cp-confirm"
            class="input"
            type="password"
            placeholder="Confirm Password"
            aria-label="Confirm Password"
            required
            autocomplete="new-password"
            dir="ltr"
          />
          <div class="modal__actions">
            <button class="btn btn--primary" type="submit">تغییر رمز</button>
            <button class="btn btn--danger-solid" type="button" data-close-change-password>انصراف</button>
          </div>
        </form>
      </div>
    </div>

    <!-- مودال تأیید حذف -->
    <div class="modal" id="confirm-modal" hidden>
      <div class="modal__backdrop" data-close-confirm></div>
      <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
        <h2 class="modal__title" id="confirm-modal-title">تأیید حذف</h2>
        <p class="modal__text" id="confirm-modal-text"></p>
        <div class="modal__actions">
          <button id="confirm-ok" class="btn btn--danger-solid" type="button">حذف</button>
          <button class="btn btn--ghost" type="button" data-close-confirm>انصراف</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="js/shared/config.js" defer></script>
    <script src="js/shared/icons.js" defer></script>
    <script src="js/panel/api.js" defer></script>
    <script src="js/panel/panel.js" defer></script>
  </body>
</html>
